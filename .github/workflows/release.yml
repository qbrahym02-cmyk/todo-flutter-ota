name: Build & Publish (APK + Web + update.json)

# يعمل تلقائياً عند أي تعديل على الكود.
# تعديل remote/config.json وحده لا يحتاج بناء — يصل للتطبيق مباشرة.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'remote/config.json'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      - name: Version info
        id: ver
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $NAME build ${{ github.run_number }}"

      # مفتاح توقيع ثابت = أندرويد يقبل التحديث فوق النسخة المثبتة
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret missing — APK will be debug-signed and in-app updates may fail."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.p12
          EOF
          sed -i 's/^ *//' android/key.properties

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.build }}

      - name: Build Web
        run: >
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.build }}

      - name: Assemble site (web app + APK + update.json)
        run: |
          mkdir -p site
          cp -r build/web/. site/
          cp build/app/outputs/flutter-apk/app-release.apk site/todo.apk
          python3 - <<'PY'
          import hashlib, json, os
          rel = json.load(open('remote/release.json', encoding='utf-8'))
          sha = hashlib.sha256(open('site/todo.apk', 'rb').read()).hexdigest()
          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
          data = {
              "version": "${{ steps.ver.outputs.name }}",
              "build": int("${{ steps.ver.outputs.build }}"),
              "min_build": int(rel.get("min_build", 0)),
              "changelog": rel.get("changelog", ""),
              "apk_url": f"https://{owner.lower()}.github.io/{repo}/todo.apk",
              "sha256": sha,
          }
          json.dump(data, open('site/update.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.build }}
          name: v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.build }})
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
